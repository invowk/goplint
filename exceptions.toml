# SPDX-License-Identifier: MPL-2.0
#
# goplint self-scan exceptions — intentional primitive type usage in the
# analyzer's own module (the dogfood configuration).
#
# Pattern syntax:
#   Type.Field           — exact struct field match
#   Function.param       — function param by name
#   Function.return.N    — return type by position (0-indexed)
#   *.Field              — any type, specific field name
#   Package.Type.*       — all fields on a type
#
# To add a new exception, append an [[exceptions]] entry with both
# pattern and reason fields.

[settings]
# Types that are never flagged regardless of context.
skip_types = ["bool", "error", "context.Context", "any"]

# Repository-wide review policy for broad or long-lived exception debt. Entries
# with their own review_after dates override this with a more specific review.
exception_review_after = "2027-06-04"
exception_review_blocked_by = "annual goplint exception governance review"

# Only emit diagnostics for packages matching these import-path prefixes.
# Third-party and stdlib packages are analyzed for type/fact resolution
# but their findings are suppressed.
include_packages = [
    "github.com/invowk/goplint",
]
